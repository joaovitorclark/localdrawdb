name: release-win

# Publica dist-win/LocalDrawDB-win.zip como asset de uma GitHub Release —
# é a única forma de um usuário Windows chegar no .exe sem clonar o
# repositório ou instalar Node/npm.
#
# Gatilho automático: todo push em main. O job check-version (barato,
# ubuntu) só deixa o build (caro, windows-latest) seguir quando a versão em
# package.json mudou desde o commit anterior — dar bump na versão e
# mergear já é o suficiente, sem precisar empurrar tag manualmente.
#
# workflow_dispatch fica como via manual (ex: re-publicar a mesma versão
# depois de um hotfix no pacote sem bump de versão).
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag da release (vazio = v<versão de package.json>)'
        required: false

permissions:
  contents: write

jobs:
  check-version:
    name: Detecta bump de versão
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - id: check
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          CURR="$(jq -r .version package.json)"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
            if [ -z "$TAG" ]; then TAG="v$CURR"; fi
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          PREV=""
          if git cat-file -e HEAD~1:package.json 2>/dev/null; then
            PREV="$(git show HEAD~1:package.json | jq -r .version)"
          fi
          TAG="v$CURR"

          if [ "$CURR" = "$PREV" ]; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "Versão não mudou ($CURR) — sem release."
          elif gh release view "$TAG" >/dev/null 2>&1; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "$TAG já existe como release — sem release duplicada."
          else
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "Versão mudou de '$PREV' para '$CURR' — release $TAG."
          fi

  build-and-release:
    name: Build + smoke test + publicar (windows-latest)
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      TAG: ${{ needs.check-version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Test suite + typecheck
        run: |
          npm test
          npm run typecheck

      - name: Build Windows package
        run: npm run build:win

      - name: Smoke test antes de publicar
        shell: pwsh
        run: |
          $dest = Join-Path $env:RUNNER_TEMP 'pkg-release'
          Expand-Archive -Path 'dist-win/LocalDrawDB-win.zip' -DestinationPath $dest
          ./scripts/build-win/ci-smoke.ps1 -PackageDir "$dest\LocalDrawDB-win" -ExpectGitAvailable $true

      - name: Create ou atualizar a GitHub Release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist-win/LocalDrawDB-win.zip --clobber
          else
            gh release create "$TAG" dist-win/LocalDrawDB-win.zip \
              --title "LocalDrawDB $TAG (Windows)" \
              --generate-notes \
              --target "$GITHUB_SHA"
          fi
